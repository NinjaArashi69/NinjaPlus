<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Unlocked | FOX ONE</title>
    <style>
        :root { 
            --bg: #050508; 
            --card: rgba(15, 15, 20, 0.85); 
            --text: #ffffff; 
            --gold: #d4af37; 
            --gold-light: #f3e5ab; 
            --accent: #00ff88; 
        }
        
        body { 
            background: radial-gradient(circle at 50% -20%, #1a1a24 0%, #000000 80%);
            color: var(--text); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px;
            box-sizing: border-box;
        }

        .container { 
            width: 100%; 
            max-width: 400px; 
            text-align: center; 
            margin-top: 50px;
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .vip-badge {
            display: inline-block;
            background: linear-gradient(135deg, #d4af37, #f3e5ab);
            color: #000;
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 2px;
            padding: 4px 12px;
            border-radius: 50px;
            margin-bottom: 15px;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }

        .key-icon { 
            background: #111; 
            width: 85px; 
            height: 85px; 
            border-radius: 50%; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            margin: -45px auto 15px; 
            border: 2px solid rgba(212, 175, 55, 0.3);
            overflow: hidden; 
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.2);
            position: relative;
            z-index: 10;
        }

        .key-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @media (min-width: 768px) {
            .container { max-width: 450px; }
            .key-icon { width: 110px; height: 110px; margin: -55px auto 20px; }
        }

        h1 { 
            font-size: 28px; 
            font-weight: 900; 
            margin: 0 0 10px; 
            background: linear-gradient(90deg, #f3e5ab, #d4af37, #f3e5ab);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
            animation: shine 3s linear infinite;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        .subtitle { color: #888; font-size: 14px; margin-bottom: 30px; letter-spacing: 0.5px; }

        .card { 
            background: var(--card); 
            backdrop-filter: blur(20px);
            border: 1px solid rgba(212, 175, 55, 0.15); 
            border-radius: 28px; 
            padding: 40px 30px 30px; 
            text-align: center; 
            box-shadow: 0 20px 60px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.05); 
            position: relative;
        }

        h2 { font-size: 22px; margin-bottom: 12px; color: var(--accent); font-weight: 700; }
        .card-p { color: #999; font-size: 14px; line-height: 1.6; margin-bottom: 25px; }

        .key-box { 
            background: #000; 
            padding: 22px; 
            border-radius: 18px; 
            border: 1px dashed var(--accent); 
            margin-bottom: 25px; 
            position: relative; 
            overflow: hidden; 
            box-shadow: inset 0 0 20px rgba(0, 255, 136, 0.05);
        }
        
        #finalKey { 
            color: var(--accent); 
            font-family: 'Courier New', monospace; 
            font-size: 19px; 
            font-weight: bold; 
            letter-spacing: 1px; 
        }
        
        .btn { 
            width: 100%; 
            padding: 18px; 
            background: linear-gradient(135deg, #d4af37 0%, #f3e5ab 50%, #d4af37 100%); 
            background-size: 200% auto;
            color: #000; 
            border: none; 
            border-radius: 16px; 
            font-size: 16px; 
            font-weight: 900; 
            cursor: pointer; 
            transition: all 0.4s ease; 
            letter-spacing: 0.5px;
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.3);
        }

        .btn:hover { 
            transform: translateY(-3px); 
            box-shadow: 0 15px 40px rgba(212, 175, 55, 0.5);
            background-position: right center;
        }

        .footer { 
            margin-top: 80px; 
            color: #333; 
            font-size: 10px; 
            letter-spacing: 2px; 
            text-transform: uppercase; 
            font-weight: bold; 
        }
    </style>
</head>
<body>

<div class="container">
    <div class="vip-badge">★ VIP ACCESS ★</div>

    <div class="key-icon">
        <img src="./assets/logo.png" alt="UKM">
    </div>

    <h1>Access Unlocked</h1>
    <p class="subtitle">Your device-locked license key is ready.</p>

    <div class="card">
        <h2>Generation Success!</h2>
        <p class="card-p">This key is locked to your device. Share it, and it won't work for others.</p>

        <div class="key-box">
            <span id="finalKey">SECURE FETCHING...</span>
        </div>

        <button class="btn" id="copyBtn" onclick="copyKey()">
            COPY TO CLIPBOARD
        </button>
    </div>

    <div class="footer">FOX ONE SECURITY SYSTEM</div>
</div>

<script>
    async function generateLockedKey() {
        try {
            const response = await fetch('https://api.ipify.org?format=json');
            const data = await response.json();
            const ip = data.ip;

            const day = Math.floor(Date.now() / 86400000);
            const ipSeed = parseInt(ip.replace(/\./g, '').substring(0, 6)); 
            
            let seed = ipSeed + day + 2026; 
            
            function rnd() { 
                var x = Math.sin(seed++) * 10000; 
                return Math.abs(x - Math.floor(x)); 
            }
            
            const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
            let segments = [];
            for(let i=0; i<4; i++) {
                let s = "";
                for(let j=0; j<4; j++) {
                    let r = Math.floor(rnd() * chars.length);
                    s += chars.charAt(r);
                }
                segments.push(s);
            }

            const finalKey = "FOXVPN-" + segments.join("-");
            document.getElementById('finalKey').innerText = finalKey;

        } catch (err) {
            document.getElementById('finalKey').innerText = "CONNECT TO INTERNET";
        }
    }

    function copyKey() {
        const keyText = document.getElementById('finalKey').innerText;
        if(keyText.includes("SECURE") || keyText.includes("CONNECT")) return;

        navigator.clipboard.writeText(keyText).then(() => {
            const btn = document.getElementById('copyBtn');
            btn.innerText = "COPIED SUCCESSFULLY! ✅";
            btn.style.background = "#00ff88";
            setTimeout(() => { 
                btn.innerText = "COPY TO CLIPBOARD"; 
                btn.style.background = ""; 
            }, 2000);
        });
    }

    window.onload = generateLockedKey;
</script>
</body>
</html>
